name: Build OpenWrt X86-64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '固件大小 (MB)'
        required: true
        default: '1024'
        type: string
      include_docker:
        description: '包含 Docker'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      router_ip:
        description: '路由器管理地址'
        required: true
        default: '192.168.1.1'
        type: string
      enable_pppoe:
        description: '启用PPPoE拨号'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      pppoe_account:
        description: 'PPPoE账号（如启用拨号）'
        required: false
        type: string
      pppoe_password:
        description: 'PPPoE密码（如启用拨号）'
        required: false
        type: string

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python2.7 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout openwrt-23.05

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Add custom feeds
        run: |
          cd openwrt
          echo 'src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main' >> feeds.conf.default
          echo 'src-git turboacc https://github.com/chenmozhijin/luci-app-turboacc.git' >> feeds.conf.default
          ./scripts/feeds update passwall turboacc
          ./scripts/feeds install -a -p passwall
          ./scripts/feeds install -a -p turboacc

      - name: Load custom configuration
        run: |
          cd openwrt
          
          # 复制配置文件
          cp $GITHUB_WORKSPACE/.config .config || true
          
          # 基础配置
          cat >> .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.profile }}
          
          # 主题
          CONFIG_PACKAGE_luci-theme-argon=y
          
          # 中文
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          
          # 应用
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          EOF
          
          # Docker
          if [ "${{ github.event.inputs.include_docker }}" = "yes" ]; then
            cat >> .config << EOF
          CONFIG_PACKAGE_luci-app-docker=y
          CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker-compose=y
          EOF
          fi
          
          make defconfig

      - name: Configure settings
        run: |
          cd openwrt
          
          # 修改默认 IP
          sed -i "s/192.168.1.1/${{ github.event.inputs.router_ip }}/g" package/base-files/files/bin/config_generate
          
          # 修改时区
          sed -i "s/'UTC'/'CST-8'/g" package/base-files/files/bin/config_generate
          sed -i "/'CST-8'/a \\t\tset system.@system[-1].zonename='Asia/Shanghai'" package/base-files/files/bin/config_generate
          
          # 设置 Argon 为默认主题
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile

      - name: Configure PPPoE
        if: github.event.inputs.enable_pppoe == 'yes'
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-pppoe-settings << 'EOF'
          #!/bin/sh
          uci set network.wan.proto='pppoe'
          uci set network.wan.username='${{ github.event.inputs.pppoe_account }}'
          uci set network.wan.password='${{ github.event.inputs.pppoe_password }}'
          uci set network.wan.ipv6='auto'
          uci commit network
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-pppoe-settings

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize files
        run: |
          mkdir -p firmware
          cp openwrt/bin/targets/x86/64/*-efi.img.gz firmware/ 2>/dev/null || true
          ls -la firmware/

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: openwrt-x86-64-${{ github.run_number }}
          name: OpenWrt X86-64 ${{ github.run_number }}
          body: |
            ## OpenWrt X86-64 固件（源码编译）
            ### 构建信息
            - **固件大小**: ${{ github.event.inputs.profile }} MB
            - **包含 Docker**: ${{ github.event.inputs.include_docker }}
            - **管理地址**: ${{ github.event.inputs.router_ip }}
            - **PPPoE拨号**: ${{ github.event.inputs.enable_pppoe }}
            ### 包含的插件
            - TurboACC - 网络加速器
            - PassWall - 代理工具
            - ttyd - Web 终端
            - luci-theme-argon - Argon 主题
            - Docker - 容器支持（可选）
            ### 默认登录信息
            - **后台地址**: ${{ github.event.inputs.router_ip }}
            - **用户名**: root
            - **密码**: 无（首次登录无需密码）
          files: firmware/*
