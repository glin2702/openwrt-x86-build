name: Build OpenWrt X86-64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '固件大小 (MB)'
        required: true
        default: '1024'
        type: string
      include_docker:
        description: '包含 Docker'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      router_ip:
        description: '路由器管理地址'
        required: true
        default: '192.168.1.1'
        type: string
      enable_pppoe:
        description: '启用PPPoE拨号'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      pppoe_account:
        description: 'PPPoE账号（如启用拨号）'
        required: false
        type: string
      pppoe_password:
        description: 'PPPoE密码（如启用拨号）'
        required: false
        type: string

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd

      - name: Download Image Builder
        run: |
          mkdir -p build_dir
          cd build_dir
          wget -q --show-progress "https://dl.openwrt.ai/releases/24.10/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst" -O imagebuilder.tar.zst
          tar -xf imagebuilder.tar.zst --strip-components=1
          rm imagebuilder.tar.zst

      - name: Configure repositories
        run: |
          cd build_dir
          echo "src/gz kwrt_base https://dl.openwrt.ai/releases/24.10/packages/x86_64/base" > repositories.conf
          echo "src/gz kwrt_packages https://dl.openwrt.ai/releases/24.10/packages/x86_64/packages" >> repositories.conf
          echo "src/gz kwrt_luci https://dl.openwrt.ai/releases/24.10/packages/x86_64/luci" >> repositories.conf
          echo "src/gz kwrt_routing https://dl.openwrt.ai/releases/24.10/packages/x86_64/routing" >> repositories.conf
          echo "src/gz kwrt_kiddin9 https://dl.openwrt.ai/releases/24.10/packages/x86_64/kiddin9" >> repositories.conf

      - name: Create custom configuration
        run: |
          cd build_dir
          mkdir -p files/etc/uci-defaults
          echo '#!/bin/sh' > files/etc/uci-defaults/99-custom-settings
          echo "uci set network.lan.ipaddr='${{ github.event.inputs.router_ip }}'" >> files/etc/uci-defaults/99-custom-settings
          echo 'uci commit network' >> files/etc/uci-defaults/99-custom-settings
          echo "uci set system.@system[0].hostname='OpenWrt'" >> files/etc/uci-defaults/99-custom-settings
          echo 'uci commit system' >> files/etc/uci-defaults/99-custom-settings
          echo "uci set system.@system[0].timezone='CST-8'" >> files/etc/uci-defaults/99-custom-settings
          echo "uci set system.@system[0].zonename='Asia/Shanghai'" >> files/etc/uci-defaults/99-custom-settings
          echo 'uci commit system' >> files/etc/uci-defaults/99-custom-settings
          echo "uci set luci.main.mediaurlbase='/luci-static/argon'" >> files/etc/uci-defaults/99-custom-settings
          echo 'uci commit luci' >> files/etc/uci-defaults/99-custom-settings
          echo 'exit 0' >> files/etc/uci-defaults/99-custom-settings
          chmod +x files/etc/uci-defaults/99-custom-settings

      - name: Configure PPPoE
        if: github.event.inputs.enable_pppoe == 'yes'
        run: |
          cd build_dir
          echo '#!/bin/sh' > files/etc/uci-defaults/99-pppoe-settings
          echo "uci set network.wan.proto='pppoe'" >> files/etc/uci-defaults/99-pppoe-settings
          echo "uci set network.wan.username='${{ github.event.inputs.pppoe_account }}'" >> files/etc/uci-defaults/99-pppoe-settings
          echo "uci set network.wan.password='${{ github.event.inputs.pppoe_password }}'" >> files/etc/uci-defaults/99-pppoe-settings
          echo "uci set network.wan.ipv6='auto'" >> files/etc/uci-defaults/99-pppoe-settings
          echo 'uci commit network' >> files/etc/uci-defaults/99-pppoe-settings
          echo '/etc/init.d/network restart' >> files/etc/uci-defaults/99-pppoe-settings
          echo 'exit 0' >> files/etc/uci-defaults/99-pppoe-settings
          chmod +x files/etc/uci-defaults/99-pppoe-settings

      - name: Build firmware
        run: |
          cd build_dir
          PACKAGES="luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-theme-argon luci-i18n-ttyd-zh-cn"
          if [ "${{ github.event.inputs.include_docker }}" = "yes" ]; then
            PACKAGES="$PACKAGES luci-app-docker luci-i18n-dockerman-zh-cn docker dockerd docker-compose"
          fi
          PACKAGES="$PACKAGES luci-app-turboacc"
          PACKAGES="$PACKAGES luci-app-passwall luci-i18n-passwall-zh-cn"
          echo "Installing packages: $PACKAGES"
          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" ROOTFS_PARTSIZE="${{ github.event.inputs.profile }}"

      - name: Organize files
        run: |
          mkdir -p firmware
          cp build_dir/bin/targets/x86/64/*-efi.img.gz firmware/ 2>/dev/null || true
          ls -la firmware/

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: openwrt-x86-64-${{ github.run_number }}
          name: OpenWrt X86-64 ${{ github.run_number }}
          body: |
            ## OpenWrt X86-64 固件
            ### 构建信息
            - **固件大小**: ${{ github.event.inputs.profile }} MB
            - **包含 Docker**: ${{ github.event.inputs.include_docker }}
            - **管理地址**: ${{ github.event.inputs.router_ip }}
            - **PPPoE拨号**: ${{ github.event.inputs.enable_pppoe }}
            ### 包含的插件
            - TurboACC - 网络加速器
            - PassWall - 代理工具
            - ttyd - Web 终端
            - luci-theme-argon - Argon 主题
            - Docker - 容器支持（可选）
            ### 默认登录信息
            - **后台地址**: ${{ github.event.inputs.router_ip }}
            - **用户名**: root
            - **密码**: 无（首次登录无需密码）
          files: firmware/*
